name: Pack & Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
      - "*.*.*-*"

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ------------------------------
      # Authenticate to GitHub Packages
      # ------------------------------
          
      - name: Add GitHub Packages NuGet source
        run: |
          dotnet nuget add source \
            --store-password-in-clear-text \
            --username ${{ github.actor }} \
            --password ${{ secrets.GH_PACKAGES_PAT }} \
            --name github-owner-123 \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      # ------------------------------
      # Extract version from tag
      # ------------------------------
      - name: Extract version from tag
        id: version
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $CLEAN_VERSION"

      # ------------------------------
      # Run your pack script
      # ------------------------------
      - name: Make pack script executable
        run: chmod +x ./pack-nuget.sh

      - name: Pack all projects
        run: ./pack-nuget.sh "${{ steps.version.outputs.version }}"

      # ------------------------------
      # Upload artifacts for debugging
      # ------------------------------
      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nuget/*.nupkg

      # ------------------------------
      # Publish to GitHub Packages
      # ------------------------------
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "nuget/*.nupkg" \
            --api-key ${{ secrets.GH_PACKAGES_PAT }} \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
