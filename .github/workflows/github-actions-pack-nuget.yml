name: Internal layered NuGet pipeline

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
      - "*.*.*-*"

permissions:
  contents: write

jobs:
  layered-pack-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Add GitHub Packages NuGet source
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GH_PACKAGES_PAT }} \
            --store-password-in-clear-text \
            --name internal-gh-packages \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Extract version from tag
        id: version
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $CLEAN_VERSION"

      - name: Make pack script executable
        run: chmod +x ./pack-nuget.sh

      - name: Layered build, pack, publish, and bump references
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        run: |
          ./pack-nuget.sh "${{ steps.version.outputs.version }}"

      - name: Configure Git for commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit updated dependency versions
        run: |
          git status
          git add .
          git commit -m "Update internal package references to version ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push origin main

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nuget/*.nupkg
